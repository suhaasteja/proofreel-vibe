<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toy CRUD App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 20px; color: #1a1a2e; }
    .input-row { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] {
      flex: 1; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 6px;
      font-size: 16px; outline: none; transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #4361ee; }
    button {
      padding: 10px 18px; border: none; border-radius: 6px; font-size: 14px;
      cursor: pointer; font-weight: 600; transition: background 0.2s;
    }
    .btn-add { background: #4361ee; color: white; }
    .btn-add:hover { background: #3a56d4; }
    .btn-edit { background: #f8961e; color: white; }
    .btn-edit:hover { background: #e08517; }
    .btn-delete { background: #ef233c; color: white; }
    .btn-delete:hover { background: #d90429; }
    .btn-save { background: #06d6a0; color: white; }
    .btn-save:hover { background: #05b88a; }
    .btn-cancel { background: #adb5bd; color: white; }
    .btn-cancel:hover { background: #868e96; }
    #item-list { list-style: none; }
    #item-list li {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border: 1px solid #e0e0e0; border-radius: 6px;
      margin-bottom: 8px; background: #fafafa;
    }
    .item-name { font-size: 16px; flex: 1; }
    .item-actions { display: flex; gap: 6px; }
    .empty-state { color: #868e96; font-style: italic; padding: 20px 0; }
  </style>
</head>
<body>
  <h1>📋 Items</h1>
  <div class="input-row">
    <input type="text" id="new-item" placeholder="Enter item name..." aria-label="New item name">
    <button class="btn-add" id="add-btn">Add</button>
  </div>
  <ul id="item-list"></ul>

  <script>
    const listEl = document.getElementById('item-list');
    const inputEl = document.getElementById('new-item');
    const addBtn = document.getElementById('add-btn');

    async function fetchItems() {
      const res = await fetch('/api/items');
      return res.json();
    }

    function renderItems(items) {
      if (items.length === 0) {
        listEl.innerHTML = '<li class="empty-state">No items yet. Add one above!</li>';
        return;
      }
      listEl.innerHTML = items.map(item => `
        <li data-id="${item.id}">
          <span class="item-name">${escapeHtml(item.name)}</span>
          <div class="item-actions">
            <button class="btn-edit" onclick="startEdit(${item.id}, '${escapeAttr(item.name)}')">Edit</button>
            <button class="btn-delete" onclick="deleteItem(${item.id})">Delete</button>
          </div>
        </li>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escapeAttr(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    async function addItem() {
      const name = inputEl.value.trim();
      if (!name) return;
      await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      inputEl.value = '';
      renderItems(await fetchItems());
    }

    async function deleteItem(id) {
      await fetch(`/api/items/${id}`, { method: 'DELETE' });
      renderItems(await fetchItems());
    }

    function startEdit(id, currentName) {
      const li = document.querySelector(`li[data-id="${id}"]`);
      li.innerHTML = `
        <input type="text" class="edit-input" value="${currentName}" style="flex:1;padding:8px;font-size:16px;border:2px solid #4361ee;border-radius:4px;">
        <div class="item-actions">
          <button class="btn-save" onclick="saveEdit(${id})">Save</button>
          <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
        </div>
      `;
      li.querySelector('.edit-input').focus();
    }

    async function saveEdit(id) {
      const input = document.querySelector('.edit-input');
      const name = input.value.trim();
      if (!name) return;
      await fetch(`/api/items/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      renderItems(await fetchItems());
    }

    async function cancelEdit() {
      renderItems(await fetchItems());
    }

    addBtn.addEventListener('click', addItem);
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') addItem(); });

    // Initial load
    fetchItems().then(renderItems);
  </script>
</body>
</html>
